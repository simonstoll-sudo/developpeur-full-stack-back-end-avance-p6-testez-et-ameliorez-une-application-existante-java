spring.application.name=norlys-mobilite
server.port=${SERVER_PORT:8080}

# Base de donnees embarquee (developpement)
spring.datasource.url=jdbc:h2:mem:norlys;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Reponses d'erreur
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always
spring.web.error.include-exception=true

# Documentation d'API
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
