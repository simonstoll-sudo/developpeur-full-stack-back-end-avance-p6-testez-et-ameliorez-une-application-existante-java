spring:
  application:
    name: ancrelieu-reservation
  datasource:
    url: ${DB_URL:jdbc:h2:mem:ancrelieu}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${SERVER_PORT:8080}
